
networks:
  sicagolf-net:
    driver: bridge

services:
  # 1. Base de datos MySQL sin contraseña para root
  db:
    image: mysql:8.0
    container_name: sicagolf-db
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: sicagolf
    networks:
      - sicagolf-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 2. Backend (NestJS) montado desde tu ruta local parametrizada
  backend:
    image: node:20-alpine
    container_name: sicagolf-backend
    working_dir: /app
    volumes:
      - ${BACKEND_PATH}:/app
    command: sh -c "npm install && npm run start:dev"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: ""
      DB_DATABASE: sicagolf
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sicagolf-net

  # 3. Frontend (Vite/React) montado desde tu ruta local parametrizada
  frontend:
    image: node:20-alpine
    container_name: sicagolf-frontend
    working_dir: /app
    volumes:
      - ${FRONTEND_PATH}:/app
    command: sh -c "npm install && npm run dev -- --host"
    environment:
      VITE_API_URL: http://backend:3000
    depends_on:
      - backend
    networks:
      - sicagolf-net

  # 4. Suite de Automatización (Playwright)
  playwright-tests:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sicagolf-playwright
    environment:
      BASE_URL: http://frontend:5173
    depends_on:
      - frontend
    networks:
      - sicagolf-net